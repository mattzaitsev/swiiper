services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: swiiper_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://swiiper_user:swiiper_pass@db:5432/swiiper_db
      REDIS_URL: redis://redis:6379/0
      MEDIA_DIR: /media
      # Corrections to the name-based 18+ check (comma-separated subreddits).
      NSFW_SUBREDDITS: ${NSFW_SUBREDDITS:-}
      SFW_SUBREDDITS: ${SFW_SUBREDDITS:-}
    volumes:
      - ./media:/media:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scraper_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: swiiper_worker
    # Denied/auth-failed requests stop for diagnosis rather than restart forever.
    restart: "no"
    environment:
      DATABASE_URL: postgresql://swiiper_user:swiiper_pass@db:5432/swiiper_db
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      # Oxylabs Web API key: the default. Taken from your environment or .env.
      OXYLABS_WEB_API_KEY: ${OXYLABS_WEB_API_KEY:-}
      # Oxylabs proxy, used only without a Web API key. Credentials: OXYLABS_PROXY_USERNAME/PASSWORD
      # here, or the secret file below.
      OXYLABS_PROXY_PRODUCT: ${OXYLABS_PROXY_PRODUCT:-residential}
      OXYLABS_PROXY_USERNAME: ${OXYLABS_PROXY_USERNAME:-}
      OXYLABS_PROXY_PASSWORD: ${OXYLABS_PROXY_PASSWORD:-}
      OXYLABS_PROXY_COUNTRY: ${OXYLABS_PROXY_COUNTRY:-US}
      OXYLABS_PROXY_STATE: ${OXYLABS_PROXY_STATE:-}
      OXYLABS_PROXY_SESSION_MINUTES: ${OXYLABS_PROXY_SESSION_MINUTES:-0}
      OXYLABS_PROXY_ENDPOINT: ${OXYLABS_PROXY_ENDPOINT:-}
      PROXY_FORCE_CLOSE: ${PROXY_FORCE_CLOSE:-0}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-swiiper-sandbox/1.0}
      SUBREDDITS: ${SUBREDDITS:-pics,aww,gaming}
      POLL_SECONDS: ${POLL_SECONDS:-300}
      OXYLABS_PROXY_CREDENTIALS_FILE: /run/secrets/oxylabs_proxy
    secrets:
      - oxylabs_proxy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: swiiper_db
    environment:
      POSTGRES_USER: swiiper_user
      POSTGRES_PASSWORD: swiiper_pass
      POSTGRES_DB: swiiper_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiiper_user -d swiiper_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: swiiper_cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

secrets:
  oxylabs_proxy:
    # Optional "username:password" file kept outside Git. Takes priority over the env credentials.
    file: ${OXYLABS_PROXY_CREDENTIALS_PATH:-./oxylabs-proxy.example.txt}
